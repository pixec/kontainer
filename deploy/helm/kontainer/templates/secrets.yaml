{{- $fullname := include "kontainer.fullname" . }}
{{- if not .Values.admin.existingSecret }}
{{- $name := printf "%s-admin" $fullname }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kontainer.labels" . | nindent 4 }}
  annotations:
    # The account outlives the release: keep its password with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.admin.username | quote }}
  password: {{ default (include "kontainer.keep" (dict "namespace" .Release.Namespace "name" $name "key" "password" "fallback" (randAlphaNum 24))) .Values.admin.password | quote }}
{{- end }}
{{- if not .Values.metrics.existingSecret }}
{{- $name := printf "%s-metrics" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kontainer.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ default (include "kontainer.keep" (dict "namespace" .Release.Namespace "name" $name "key" "token" "fallback" (randAlphaNum 40))) .Values.metrics.token | quote }}
{{- end }}
{{- if and (not .Values.database.existingSecret) .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-database
  labels:
    {{- include "kontainer.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}
